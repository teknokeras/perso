[workspace]
resolver = "2"
members = [
    "crates/policy-core",
    "crates/policy-compiler",
    "crates/policy-runtime",
    "crates/policy-test",
]

# ─── Workspace-level dependency table ────────────────────────────────────────
# All crates inherit from here; individual Cargo.tomls use
#   some-dep = { workspace = true }
[workspace.dependencies]
boon        = "0.6.1"     
serde       = { version = "=1.0.228", features = ["derive"] }
serde_json  = "1.0.150"
anyhow      = "1.0.102"
clap        = { version = "4.6.1", features = ["derive"] }
# wasmtime added back in Phase 6 with toolchain upgrade

# ─── Pinned transitive deps required for wasmtime 14 on Rust 1.75 ─────────────
wasmtime   = { version = "=21.0.1" } # don't get tempted to upgrade this wasmtime until you test the new version of the wasmtime
indexmap  = "=2.14.0"
uuid      = "=1.23.2"
